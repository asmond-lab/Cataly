name: Cataly Native

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - native/**
      - extension/**
      - skills/cataly-mode/scripts/src/messenger/**
      - .github/workflows/cataly-native.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - native/**
      - extension/**
      - skills/cataly-mode/scripts/src/messenger/**
      - .github/workflows/cataly-native.yml
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked
      - uses: ./.github/actions/setup
        with:
          fixtures: host
      - run: cargo build --locked
      - name: Exercise head and ASK with the native routing binary
        working-directory: extension
        run: |
          CATALY_DISCORD_NATIVE_BIN="$GITHUB_WORKSPACE/target/debug/cataly" \
            bun test ./test/head-admission.test.ts ./test/head-receipt.test.ts ./test/discord-ask-mailbox.test.ts

  stock-omp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(github.event_name == 'schedule' && '["latest"]' || '["v19.0.0", "v19.1.0"]') }}
    name: Stock OMP (${{ matrix.tag }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: cargo build --locked --release
      - name: Verify official OMP and test Cataly against a loopback model
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if [[ $OMP_TAG == latest ]]; then
            OMP_TAG=$(gh release view --repo can1357/oh-my-pi --json tagName --jq .tagName)
          fi
          [[ $OMP_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bin=$(mktemp -d "$RUNNER_TEMP/cataly-omp.XXXXXXXX")
          url="https://github.com/can1357/oh-my-pi/releases/download/$OMP_TAG"
          (
            cd "$bin"
            curl --fail --silent --show-error --location "$url/SHA256SUMS.txt" -o SHA256SUMS.txt
            curl --fail --silent --show-error --location "$url/omp-linux-x64" -o omp-linux-x64
            grep -E '^[[:xdigit:]]{64}  omp-linux-x64$' SHA256SUMS.txt | sha256sum --strict -c -
            chmod 700 omp-linux-x64
            [[ $(./omp-linux-x64 --version) == "omp/${OMP_TAG#v}" ]]
          )
          bash native/tests/stock-omp.sh target/release/cataly "$bin/omp-linux-x64"
          python3 native/tests/stock-run.py target/release/cataly "$bin/omp-linux-x64"
