# Cataly source candidate; state and credentials stay in project-scoped named volumes.
# First run and daily use are documented in docs/container.md.
name: omp-cataly-candidate
services:
  cataly:
    build:
      context: ../..
      dockerfile: examples/container/Dockerfile
    image: omp-cataly-candidate:local
    init: true
    # the container idles in sleep; work happens through docker exec
    command: ["sleep", "infinity"]
    # sized like a small dev machine: lanes run builds and tests of their own
    cpus: "4"
    mem_limit: 8g
    # no credentials and no secrets in this file or in the image; interactive logins
    # (gh, agent-messenger, OMP providers) are done once inside the running container
    # and persist in the volumes below
    volumes:
      - cataly-state:/home/cataly/.cataly
      - omp-state:/home/cataly/.omp
      - gh-auth:/home/cataly/.config/gh
      - messenger-auth:/home/cataly/.config/agent-messenger
      - projects:/home/cataly/projects

volumes:
  cataly-state: {}
  omp-state: {}
  gh-auth: {}
  messenger-auth: {}
  projects: {}
